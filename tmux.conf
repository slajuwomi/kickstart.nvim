# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Set profix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# gruvbox theme based on merhetz/gruvbox
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# # minimal tmux status bar theme
# set -g @plugin 'vaaleyard/tmux-dotbar'
# # gruvbox colors for the status bar
# set -g @tmux-dotbar-bg "#1d2021"
# set -g @tmux-dotbar-fg "#ebdbb2"
# set -g @tmux-dotbar-fg-current "#8ec07c"
# set -g @tmux-dotbar-fg-session "#a89984"
# set -g @tmux-dotbar-fg-prefix "#d3869b"
# # show time on right part
# set -g @tmux-dotbar-right true

# automatic renumbering when windows are closed
# and start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

run '~/.tmux/plugins/tpm/tpm'
